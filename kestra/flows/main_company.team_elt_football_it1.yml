id: elt_football_it1
namespace: company.team

inputs:
  - id: assets
    type: MULTISELECT
    values:
      - competitions
      - clubs
      - players
      - games
      - appearances
      - player_valuations
      - transfers
      - club_games
      - game_events
      - game_lineups
      - countries
      - national_teams
    defaults:
      - competitions
      - clubs
      - players
      - games
      - appearances
      - player_valuations
      - transfers
      - club_games
      - game_events
      - game_lineups
      - countries
      - national_teams

tasks:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  - id: create_warehouse
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    role: "{{ envs.snowflake_role }}"
    sql: |
      CREATE WAREHOUSE IF NOT EXISTS {{ envs.snowflake_warehouse }}
      WAREHOUSE_SIZE = 'XSMALL'
      AUTO_SUSPEND = 60
      AUTO_RESUME = TRUE

  - id: create_database
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    role: "{{ envs.snowflake_role }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    sql: |
      CREATE DATABASE IF NOT EXISTS {{ envs.snowflake_database }}

  - id: create_bronze_schema
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    role: "{{ envs.snowflake_role }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    sql: |
      CREATE SCHEMA IF NOT EXISTS
      {{ envs.snowflake_database }}.{{ envs.snowflake_bronze_schema }}

  - id: create_silver_schema
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    role: "{{ envs.snowflake_role }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    sql: |
      CREATE SCHEMA IF NOT EXISTS
      {{ envs.snowflake_database }}.{{ envs.snowflake_silver_schema }}

  - id: create_gold_schema
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    role: "{{ envs.snowflake_role }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    sql: |
      CREATE SCHEMA IF NOT EXISTS
      {{ envs.snowflake_database }}.{{ envs.snowflake_gold_schema }}

  # ---------------------------------------------------------------------------
  # Bronze landing infrastructure
  # ---------------------------------------------------------------------------

  - id: create_stage
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    role: "{{ envs.snowflake_role }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    sql: |
      CREATE STAGE IF NOT EXISTS
      {{ envs.snowflake_database }}.{{ envs.snowflake_bronze_schema }}.TRANSFERMARKT_STAGE

  - id: create_csv_format
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    role: "{{ envs.snowflake_role }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    sql: |
      CREATE OR REPLACE FILE FORMAT
      {{ envs.snowflake_database }}.{{ envs.snowflake_bronze_schema }}.CSV_GZIP_FORMAT
      TYPE = CSV
      COMPRESSION = GZIP
      PARSE_HEADER = TRUE
      FIELD_OPTIONALLY_ENCLOSED_BY = '"'
      EMPTY_FIELD_AS_NULL = TRUE
      NULL_IF = ('')
      ERROR_ON_COLUMN_COUNT_MISMATCH = FALSE

